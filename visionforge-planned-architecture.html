:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;coding-multiagent-current-target&quot;&gt;
  &lt;style&gt;
    #coding-multiagent-current-target {
      width: 100%;
      color: var(--foreground);
      box-sizing: border-box;
      overflow-wrap: anywhere;
    }

    #coding-multiagent-current-target * {
      box-sizing: border-box;
      min-width: 0;
    }

    #coding-multiagent-current-target h2,
    #coding-multiagent-current-target h3,
    #coding-multiagent-current-target p,
    #coding-multiagent-current-target ul {
      margin: 0;
    }

    #coding-multiagent-current-target h2,
    #coding-multiagent-current-target h3,
    #coding-multiagent-current-target strong {
      font-weight: 500;
    }

    #coding-multiagent-current-target small,
    #coding-multiagent-current-target .muted {
      color: var(--muted-foreground);
    }

    #coding-multiagent-current-target .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: end;
      gap: 8px 18px;
      padding-bottom: 14px;
    }

    #coding-multiagent-current-target .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      color: var(--muted-foreground);
    }

    #coding-multiagent-current-target .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #coding-multiagent-current-target .key {
      width: 18px;
      height: 10px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: color-mix(in srgb, var(--card) 92%, transparent);
    }

    #coding-multiagent-current-target .key.planned {
      background: transparent;
      border-style: dashed;
    }

    #coding-multiagent-current-target .layer {
      padding: 14px 0;
      border-top: 1px solid var(--border);
    }

    #coding-multiagent-current-target .layer-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 12px;
      margin-bottom: 10px;
    }

    #coding-multiagent-current-target .index {
      color: var(--muted-foreground);
      font-variant-numeric: tabular-nums;
    }

    #coding-multiagent-current-target .grid-2,
    #coding-multiagent-current-target .grid-3,
    #coding-multiagent-current-target .grid-4 {
      display: grid;
      gap: 9px;
    }

    #coding-multiagent-current-target .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    #coding-multiagent-current-target .grid-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    #coding-multiagent-current-target .grid-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    #coding-multiagent-current-target .node {
      display: grid;
      place-content: center;
      gap: 3px;
      min-height: 62px;
      padding: 10px;
      text-align: center;
      color: var(--card-foreground);
      background: color-mix(in srgb, var(--card) 92%, transparent);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    #coding-multiagent-current-target .node.core {
      background: color-mix(in srgb, var(--viz-series-3) 10%, var(--card));
      border-color: color-mix(in srgb, var(--viz-series-3) 42%, var(--border));
    }

    #coding-multiagent-current-target .node.scene {
      background: color-mix(in srgb, var(--viz-series-1) 10%, var(--card));
      border-color: color-mix(in srgb, var(--viz-series-1) 42%, var(--border));
    }

    #coding-multiagent-current-target .node.planned,
    #coding-multiagent-current-target .capability.planned {
      background: transparent;
      border-style: dashed;
    }

    #coding-multiagent-current-target .split {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    #coding-multiagent-current-target .lane {
      padding-left: 12px;
      border-left: 3px solid var(--border);
    }

    #coding-multiagent-current-target .lane.scene {
      border-left-color: var(--viz-series-1);
    }

    #coding-multiagent-current-target .lane-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 4px 12px;
      margin-bottom: 8px;
    }

    #coding-multiagent-current-target .sequence {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      counter-reset: step;
    }

    #coding-multiagent-current-target .step {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      align-items: center;
      gap: 7px;
      min-height: 62px;
      padding: 9px;
      color: var(--card-foreground);
      background: color-mix(in srgb, var(--card) 92%, transparent);
      border: 1px solid var(--border);
      border-radius: 6px;
      counter-increment: step;
    }

    #coding-multiagent-current-target .step::before {
      content: counter(step);
      display: grid;
      place-items: center;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      color: var(--foreground);
      background: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    #coding-multiagent-current-target .step-copy {
      display: grid;
      gap: 3px;
    }

    #coding-multiagent-current-target .down {
      padding: 4px 0;
      text-align: center;
      color: var(--muted-foreground);
    }

    #coding-multiagent-current-target .plugin-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }

    #coding-multiagent-current-target .flow-note {
      margin-top: 8px;
      padding: 8px 10px;
      color: var(--muted-foreground);
      background: color-mix(in srgb, var(--muted) 55%, transparent);
      border-left: 2px solid var(--border);
    }

    #coding-multiagent-current-target .capabilities {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    #coding-multiagent-current-target .capability {
      padding: 9px 10px;
      border-top: 3px solid var(--border);
    }

    #coding-multiagent-current-target .capability.core-cap {
      border-top-color: var(--viz-series-3);
    }

    #coding-multiagent-current-target .capability.scene-cap {
      border-top-color: var(--viz-series-1);
    }

    #coding-multiagent-current-target .capability.plan-cap {
      border-top-color: var(--viz-series-2);
    }

    #coding-multiagent-current-target .capability ul {
      display: grid;
      gap: 5px;
      padding: 8px 0 0 20px;
    }

    #coding-multiagent-current-target .decision {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(145px, .75fr) minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }

    #coding-multiagent-current-target .outcomes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    #coding-multiagent-current-target .outcome {
      padding: 8px;
      text-align: center;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    #coding-multiagent-current-target .outcome.complete {
      color: var(--green);
    }

    #coding-multiagent-current-target .outcome.rework {
      color: var(--orange);
    }

    #coding-multiagent-current-target .outcome.stop {
      color: var(--red);
    }

    #coding-multiagent-current-target .limits {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 14px;
      margin: 0;
      padding-left: 22px;
    }

    @media (max-width: 650px) {
      #coding-multiagent-current-target .split,
      #coding-multiagent-current-target .capabilities,
      #coding-multiagent-current-target .decision {
        grid-template-columns: 1fr;
      }

      #coding-multiagent-current-target .grid-4,
      #coding-multiagent-current-target .plugin-strip,
      #coding-multiagent-current-target .sequence {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      #coding-multiagent-current-target .limits {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 390px) {
      #coding-multiagent-current-target .grid-2,
      #coding-multiagent-current-target .grid-3,
      #coding-multiagent-current-target .grid-4,
      #coding-multiagent-current-target .plugin-strip,
      #coding-multiagent-current-target .sequence,
      #coding-multiagent-current-target .outcomes {
        grid-template-columns: 1fr;
      }
    }

        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-note&quot;&gt;&lt;strong&gt;目标：&lt;/strong&gt;Generic Coding 也包装为 ScenarioProfile，并通过统一 ScenarioRuntime 执行；这部分当前仍应使用虚线标注。&lt;/div&gt;
      &lt;div class=&quot;grid-2&quot; style=&quot;margin-top:8px&quot;&gt;
        &lt;div class=&quot;node planned&quot;&gt;&lt;strong&gt;Generic Coding ScenarioProfile&lt;/strong&gt;&lt;small&gt;规划：接入统一跨轮 Runtime&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;node planned&quot;&gt;&lt;strong&gt;visionforge:web_visual&lt;/strong&gt;&lt;small&gt;规划：迁移为可选场景插件&lt;/small&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;layer&quot;&gt;
      &lt;div class=&quot;layer-head&quot;&gt;&lt;span class=&quot;index&quot;&gt;04&lt;/span&gt;&lt;h3&gt;Worker Group 与真实 DAG&lt;/h3&gt;&lt;small&gt;通过 Artifact 交接，不自由聊天&lt;/small&gt;&lt;/div&gt;
      &lt;div class=&quot;lane&quot;&gt;
        &lt;div class=&quot;lane-head&quot;&gt;&lt;strong&gt;Generic Coding Worker Group&lt;/strong&gt;&lt;small&gt;由 TaskGraph 决定依赖与并行&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;grid-4&quot;&gt;
          &lt;div class=&quot;node&quot;&gt;&lt;strong&gt;Planner&lt;/strong&gt;&lt;small&gt;拆解任务&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;node&quot;&gt;&lt;strong&gt;Implementer&lt;/strong&gt;&lt;small&gt;生成 ImplementationPlan&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;node&quot;&gt;&lt;strong&gt;Tester&lt;/strong&gt;&lt;small&gt;执行授权验证&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;node&quot;&gt;&lt;strong&gt;Fixer&lt;/strong&gt;&lt;small&gt;根据失败证据修复&lt;/small&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;lane scene&quot; style=&quot;margin-top:14px&quot;&gt;
        &lt;div class=&quot;lane-head&quot;&gt;&lt;strong&gt;VisionForge Main DAG&lt;/strong&gt;&lt;small&gt;主链路顺序&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;sequence&quot;&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;step-copy&quot;&gt;&lt;strong&gt;UI Analyst&lt;/strong&gt;&lt;small&gt;需求 + 参考图 → UI Spec&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;step-copy&quot;&gt;&lt;strong&gt;Web Developer&lt;/strong&gt;&lt;small&gt;UI Spec → 页面 Patch&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;step-copy&quot;&gt;&lt;strong&gt;Patch Integrator&lt;/strong&gt;&lt;small&gt;确定性安全合并&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;step-copy&quot;&gt;&lt;strong&gt;Browser Tester&lt;/strong&gt;&lt;small&gt;构建 · DOM · 交互 · 截图&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;step-copy&quot;&gt;&lt;strong&gt;Visual Reviewer&lt;/strong&gt;&lt;small&gt;参考图与截图对比&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;step-copy&quot;&gt;&lt;strong&gt;Quality Gate&lt;/strong&gt;&lt;small&gt;汇总 Runtime 证据&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;lane-head&quot; style=&quot;margin-top:12px&quot;&gt;&lt;strong&gt;VisionForge Fix DAG&lt;/strong&gt;&lt;small&gt;仅在门禁失败后创建&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;sequence&quot;&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;step-copy&quot;&gt;&lt;strong&gt;Web Fixer&lt;/strong&gt;&lt;small&gt;生成局部修复 Patch&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;step-copy&quot;&gt;&lt;strong&gt;Patch Integrator&lt;/strong&gt;&lt;small&gt;重新合并&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;step-copy&quot;&gt;&lt;strong&gt;Browser Tester&lt;/strong&gt;&lt;small&gt;重新验证与截图&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;step-copy&quot;&gt;&lt;strong&gt;Visual Reviewer&lt;/strong&gt;&lt;small&gt;重新视觉审查&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;step-copy&quot;&gt;&lt;strong&gt;Quality Gate&lt;/strong&gt;&lt;small&gt;重新裁决&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;layer&quot;&gt;
      &lt;div class=&quot;layer-head&quot;&gt;&lt;span class=&quot;index&quot;&gt;05&lt;/span&gt;&lt;h3&gt;能力与所有权边界&lt;/h3&gt;&lt;/div&gt;
      &lt;div class=&quot;capabilities&quot;&gt;
        &lt;div class=&quot;capability core-cap&quot;&gt;
          &lt;div class=&quot;lane-head&quot;&gt;&lt;strong&gt;Core 共享能力&lt;/strong&gt;&lt;small&gt;所有场景可复用&lt;/small&gt;&lt;/div&gt;
          &lt;ul&gt;
            &lt;li&gt;&lt;strong&gt;ModelClientFactory&lt;/strong&gt;：LLM / VLM 能力检查与路由&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;ArtifactStore&lt;/strong&gt;：运行时结构化产物与验证状态&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;MemoryManager / SQLiteMemoryStore&lt;/strong&gt;&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;TaskDispatcher / LifecycleController&lt;/strong&gt;&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;ProjectWorkspace / PatchIntegrator&lt;/strong&gt;&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;

        &lt;div class=&quot;capability scene-cap&quot;&gt;
          &lt;div class=&quot;lane-head&quot;&gt;&lt;strong&gt;VisionForge 场景能力&lt;/strong&gt;&lt;small&gt;不属于 Core&lt;/small&gt;&lt;/div&gt;
          &lt;ul&gt;
            &lt;li&gt;&lt;strong&gt;ImageAssetStore&lt;/strong&gt;：参考图与截图&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;UI Spec / Visual Review&lt;/strong&gt; 协议&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;Vue / Vite / Playwright&lt;/strong&gt;&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;VisionForgeQualityGate&lt;/strong&gt;&lt;/li&gt;
            &lt;li&gt;固定页面评测与三方案对照&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;

        &lt;div class=&quot;capability plan-cap planned&quot;&gt;
          &lt;div class=&quot;lane-head&quot;&gt;&lt;strong&gt;规划中的通用能力&lt;/strong&gt;&lt;small&gt;尚未实现&lt;/small&gt;&lt;/div&gt;
          &lt;ul&gt;
            &lt;li&gt;&lt;strong&gt;ValidatorProfile&lt;/strong&gt;：build / test / API / CLI / browser&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;GitWorkspace&lt;/strong&gt;：branch / worktree / commit / rollback&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;Media Evidence&lt;/strong&gt;：通用图片、音频、视频证据&lt;/li&gt;
            &lt;li&gt;任务级成本、Token 与执行时间预算&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;flow-note&quot;&gt;&lt;strong&gt;持久化关系：&lt;/strong&gt;ArtifactStore → SQLiteRuntimeStore 快照；ScenarioRunState → SQLiteScenarioRunStore；MemoryManager → SQLiteMemoryStore。ArtifactStore 不是独立外部数据库。&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;layer&quot;&gt;
      &lt;div class=&quot;layer-head&quot;&gt;&lt;span class=&quot;index&quot;&gt;06&lt;/span&gt;&lt;h3&gt;验证、收敛与返工&lt;/h3&gt;&lt;small&gt;模型不能自行宣告完成&lt;/small&gt;&lt;/div&gt;
      &lt;div class=&quot;split&quot; style=&quot;margin-bottom:9px&quot;&gt;
        &lt;div class=&quot;node&quot;&gt;&lt;strong&gt;Generic Coding 验证&lt;/strong&gt;&lt;small&gt;build · unit test · regression · 权限证据&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;node scene&quot;&gt;&lt;strong&gt;VisionForge Quality Gate&lt;/strong&gt;&lt;small&gt;build · DOM/交互 · console/page/network · VLM · P1/P2&lt;/small&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;decision&quot;&gt;
        &lt;div class=&quot;node&quot;&gt;&lt;strong&gt;最新验证证据&lt;/strong&gt;&lt;small&gt;Build Result · Test Report · Browser Run · Screenshot · Visual Review&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;node core&quot;&gt;&lt;strong&gt;ScenarioProfile.decide()&lt;/strong&gt;&lt;small&gt;生成 ConvergenceDecision&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;outcomes&quot;&gt;
          &lt;div class=&quot;outcome complete&quot;&gt;&lt;strong&gt;COMPLETE&lt;/strong&gt;&lt;/div&gt;
          &lt;div class=&quot;outcome rework&quot;&gt;&lt;strong&gt;REWORK&lt;/strong&gt;&lt;/div&gt;
          &lt;div class=&quot;outcome stop&quot;&gt;&lt;strong&gt;FAIL&lt;/strong&gt;&lt;/div&gt;
          &lt;div class=&quot;outcome&quot;&gt;&lt;strong&gt;NEEDS_INPUT&lt;/strong&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-note&quot;&gt;REWORK → ScenarioRuntime 增加轮次 → ScenarioProfile.build_round() 创建局部 Fix DAG → 产生新证据 → 再次 decide()。最大轮数、恢复和终态均由 Runtime 控制。&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;layer&quot;&gt;
      &lt;div class=&quot;layer-head&quot;&gt;&lt;span class=&quot;index&quot;&gt;边界&lt;/span&gt;&lt;h3&gt;当前单机 MVP 限制&lt;/h3&gt;&lt;/div&gt;
      &lt;ul class=&quot;limits&quot;&gt;
        &lt;li&gt;线程池 + SQLite，尚无分布式任务队列和多租户隔离。&lt;/li&gt;
        &lt;li&gt;Web 任务列表仍在内存中，服务重启后不能继续查询旧列表。&lt;/li&gt;
        &lt;li&gt;VisionForge 固定浏览器端口，Web Runtime 当前串行执行页面任务。&lt;/li&gt;
        &lt;li&gt;通用 RequirementEvidence、CodingRequirement 和 ValidatorProfile 尚未实现。&lt;/li&gt;
        &lt;li&gt;VisionForge 尚未迁移为 PluginRegistry 管理的可选插件。&lt;/li&gt;
        &lt;li&gt;Runtime 暂无自动 Git branch、commit、rollback 或 PR 工作流。&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/section&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
