<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f8f4;color:#17231f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{min-height:900px;padding:28px 76px;overflow:hidden;position:relative}.orb{position:absolute;border-radius:999px;filter:blur(2px)}.orb.a{width:470px;height:470px;background:#d9f8a8;right:-130px;top:70px}.orb.b{width:260px;height:260px;background:#d9e9ff;left:42%;bottom:-120px}nav{height:62px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}.brand{font-weight:800;font-size:25px;letter-spacing:-1px}.brand i{display:inline-block;width:13px;height:13px;background:#1f8f68;border-radius:4px;transform:rotate(20deg);margin-right:9px}.links{display:flex;gap:34px;color:#53605b;font-size:14px}.nav-cta{padding:12px 20px;border:1px solid #17231f;border-radius:999px;font-weight:700}.hero{height:720px;display:grid;grid-template-columns:1.08fr .92fr;gap:72px;align-items:center;position:relative;z-index:1}.eyebrow{display:inline-flex;gap:9px;align-items:center;color:#267b5e;font-weight:800;font-size:13px;letter-spacing:1.7px}.eyebrow:before{content:"";width:28px;height:2px;background:#267b5e}.copy h1{font-family:Georgia,serif;font-size:72px;line-height:1.03;letter-spacing:-3px;margin:25px 0 24px;max-width:680px}.copy h1 span{color:#2c8d69}.copy p{font-size:19px;line-height:1.75;color:#62706a;max-width:580px}.form{display:flex;gap:10px;margin-top:38px;padding:8px;background:white;border-radius:18px;box-shadow:0 18px 50px rgba(27,54,44,.13);max-width:570px}.form input{flex:1;border:0;padding:0 18px;font-size:16px;outline:0}.form button{border:0;background:#173e31;color:white;border-radius:12px;padding:18px 27px;font-weight:800;font-size:15px}.note{margin-top:15px;color:#76827d;font-size:13px}.visual{position:relative;height:590px}.panel{position:absolute;background:#153b30;color:white;border-radius:36px;width:450px;height:530px;right:18px;top:20px;padding:34px;box-shadow:0 30px 80px rgba(22,52,42,.25)}.panel-top{display:flex;justify-content:space-between;color:#b7c9c1;font-size:13px}.score{margin-top:58px;font-size:14px;color:#b7c9c1}.score strong{display:block;color:white;font:70px Georgia,serif;margin-top:8px}.chart{height:135px;margin-top:25px;border-bottom:1px solid #537064;position:relative}.chart svg{width:100%;height:100%}.people{display:flex;margin-top:38px}.avatar{width:43px;height:43px;border-radius:50%;border:3px solid #153b30;margin-right:-9px;background:#f1caa9}.avatar:nth-child(2){background:#a8d7e2}.avatar:nth-child(3){background:#f1b4bb}.people span{margin-left:22px;align-self:center;color:#c4d2cc;font-size:13px}.float{position:absolute;background:white;border-radius:20px;padding:18px 22px;box-shadow:0 20px 45px rgba(26,48,40,.17);color:#20352d}.float.one{left:-30px;top:110px}.float.two{right:-22px;bottom:56px}.float b{display:block;font-size:21px;margin-top:5px}.float small{color:#7b8983}.badge{display:inline-block;width:9px;height:9px;border-radius:50%;background:#79d79b;margin-right:6px}
  </style>
</head>
<body><div class="page"><div class="orb a"></div><div class="orb b"></div><nav><div class="brand"><i></i>Flowmint</div><div class="links"><span>产品</span><span>解决方案</span><span>客户故事</span><span>定价</span></div><div class="nav-cta">登录</div></nav><main class="hero"><section class="copy"><div class="eyebrow">为成长型团队打造</div><h1>让团队的工作流<br><span>更清晰</span></h1><p>把散落的任务、进展和反馈汇聚到一个地方。少一点重复沟通，多一点真正有价值的协作。</p><div class="form"><input placeholder="输入工作邮箱"><button>开始体验 →</button></div><div class="note">免费试用 14 天 · 无需信用卡</div></section><section class="visual"><div class="panel"><div class="panel-top"><span>团队效率</span><span>本季度 ↗</span></div><div class="score"><span>完成率</span><strong>87%</strong></div><div class="chart"><svg viewBox="0 0 350 120"><path d="M0 103 C55 98 52 72 105 77 S160 30 210 50 S275 9 350 17" fill="none" stroke="#b6f36b" stroke-width="7" stroke-linecap="round"/></svg></div><div class="people"><div class="avatar"></div><div class="avatar"></div><div class="avatar"></div><span>12 位成员正在协作</span></div></div><div class="float one"><small><span class="badge"></span>今日已完成</small><b>24 项任务</b></div><div class="float two"><small>平均节省时间</small><b>每周 8.4h</b></div></section></main></div></body>
</html>
